events {
    worker_connections 1024;
}

http {
    upstream gateway-cluster {
        # Round-Robin across the 3 Gateway replicas
        server gateway-1:3000 max_fails=3 fail_timeout=10s;
        server gateway-2:3000 max_fails=3 fail_timeout=10s;
        server gateway-3:3000 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;

        location / {
            proxy_pass http://gateway-cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Load-Balancer "nginx-round-robin";

            # Retain and forward gateway & microservice tracking headers
            proxy_pass_header X-Served-By;
            proxy_pass_header X-Gateway-Instance;
            proxy_pass_header X-Gateway-Port;
            proxy_pass_header X-Proxied-To;
            proxy_pass_header X-Service-Name;
            proxy_pass_header X-Service-Port;
            add_header X-Load-Balancer "nginx-round-robin" always;
        }
    }
}

